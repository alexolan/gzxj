name: Overlay Build (upstream + patch)

# 增量包构建工作流：自动拉取上游 bjzhou/PhotonCamera 最新代码，
# 叠加 overlay/ 里的增量补丁（闪退修复 + AI 构图）后构建 APK。
#
# 仓库结构（本工作流所在仓库）:
#   overlay/                     ← 增量包（patches/ + files/ + apply-overlay.sh）
#   .github/workflows/overlay-build.yml
#
# 触发方式:
#   - Actions 页面手动 Run workflow（可指定上游分支/tag/commit）
#   - 推送改动到 overlay/ 目录自动构建
#
# 上游作者更新后的升级流程:
#   1. 直接在 Actions 页面点 Run workflow（默认跟随上游 main 最新）
#   2. patch 全部精确合并 → 完美升级，上游更新全保留
#   3. 某个 patch 被上游改动冲突 → 自动降级完整文件覆盖（功能不丢），
#      Actions 的 Summary 会列出哪些补丁被覆盖，想保留上游新改动时
#      再手动 rebase 那几个文件即可

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游 ref（分支 / tag / commit）'
        required: false
        default: 'main'
  push:
    branches: [ main, master ]
    paths: [ 'overlay/**' ]

permissions:
  contents: read

jobs:
  build:
    name: Build from upstream + overlay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout overlay repository
        uses: actions/checkout@v4

      - name: Clone upstream PhotonCamera
        env:
          UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'main' }}
        run: |
          git clone --depth 1 --branch "$UPSTREAM_REF" \
            https://github.com/bjzhou/PhotonCamera.git upstream

      - name: Apply overlay patches
        run: |
          chmod +x overlay/apply-overlay.sh
          bash overlay/apply-overlay.sh overlay upstream 2>&1 | tee apply-report.txt

      - name: Set up Amazon Corretto 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x upstream/gradlew

      - name: Create local.properties
        working-directory: upstream
        run: |
          {
            printf 'BUILT_IN_API_KEY=%s\n' ""
            printf 'BUILT_IN_API_KEY_GOOGLE=%s\n' ""
          } > local.properties

      - name: Build release APK
        working-directory: upstream
        env:
          # 仓库内置签名（overlay/files/app/release.keystore，已由 apply 脚本复制到位）
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: release.keystore
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: photon2026
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: nova
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: photon2026
        run: ./gradlew ":app:assembleDefaultRelease" --console=plain

      - name: Save release APK
        uses: actions/upload-artifact@v4
        with:
          name: overlay-apk
          path: upstream/app/build/outputs/apk/default/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Save R8 mapping (for crash stack de-obfuscation)
        uses: actions/upload-artifact@v4
        with:
          name: overlay-mapping
          path: upstream/app/build/outputs/mapping/defaultRelease/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Save overlay apply report
        uses: actions/upload-artifact@v4
        with:
          name: overlay-apply-report
          path: apply-report.txt
          if-no-files-found: warn
          retention-days: 30
